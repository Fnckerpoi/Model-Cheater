<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Model-Cheater 开源系列路线图</title><desc id="desc">系列入口、方法论、Agent 能力、端到端 RSI 示例，以及 EBC 和 MOM 规划探索方向。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172c43"/></linearGradient><linearGradient id="a"><stop stop-color="#42d3bd"/><stop offset="1" stop-color="#65a9ff"/></linearGradient></defs><rect width="1440" height="760" rx="28" fill="url(#bg)"/><text x="72" y="82" fill="#f4f7fb" font-family="sans-serif" font-size="38" font-weight="700">Model-Cheater · 开源系列路线图</text><text x="74" y="120" fill="#a9bbd1" font-family="sans-serif" font-size="17">从可复用的 Agent 改进回路，逐步延伸到企业业务与制造运营系统</text><rect x="72" y="151" width="1296" height="4" rx="2" fill="url(#a)"/><text x="74" y="200" fill="#77e2d1" font-family="sans-serif" font-size="14" font-weight="700">FOUNDATION · 系列基础</text><g font-family="sans-serif"><rect x="72" y="224" width="390" height="142" rx="18" fill="#17283c" stroke="#43d1bb" stroke-width="2"/><circle cx="110" cy="263" r="17" fill="#43d1bb"/><path d="m102 263 6 6 11-13" fill="none" stroke="#08201e" stroke-width="3"/><text x="143" y="269" fill="#eaf5f5" font-size="14" font-weight="700">已完成 · 系列入口</text><text x="100" y="316" fill="#fff" font-size="22" font-weight="700">建立总入口与项目索引</text><text x="100" y="346" fill="#a9bbd1" font-size="15">统一理念、项目清单与协作入口</text><path d="M462 295h48m-8-6 8 6-8 6" fill="none" stroke="#60758e" stroke-width="2"/><rect x="510" y="224" width="390" height="142" rx="18" fill="#17283c" stroke="#5d9df4" stroke-width="2"/><rect x="540" y="248" width="88" height="27" rx="13" fill="#1d4267"/><text x="555" y="267" fill="#a9d0ff" font-size="13" font-weight="700">进行中</text><text x="540" y="310" fill="#fff" font-size="22" font-weight="700">沉淀方法论</text><text x="540" y="342" fill="#a9bbd1" font-size="15">记忆分层 · 上下文预算 · 验收纪律</text><path d="M900 295h48m-8-6 8 6-8 6" fill="none" stroke="#60758e" stroke-width="2"/><rect x="948" y="224" width="420" height="142" rx="18" fill="#17283c" stroke="#5d9df4" stroke-width="2"/><rect x="978" y="248" width="88" height="27" rx="13" fill="#1d4267"/><text x="993" y="267" fill="#a9d0ff" font-size="13" font-weight="700">进行中</text><text x="978" y="310" fill="#fff" font-size="22" font-weight="700">构建可复用的 Agent 能力</text><text x="978" y="342" fill="#a9bbd1" font-size="15">记忆闭环 · 编排模板 · 可追溯决策</text><text x="74" y="420" fill="#c7a7ff" font-size="14" font-weight="700">NEXT · 验证与拓展</text><rect x="72" y="444" width="390" height="150" rx="18" fill="#19263b" stroke="#8b72da" stroke-width="2"/><circle cx="109" cy="483" r="17" fill="#725bb8"/><text x="103" y="489" fill="#fff" font-size="16" font-weight="700">3</text><text x="143" y="489" fill="#e3d8ff" font-size="14" font-weight="700">后续建设</text><text x="100" y="533" fill="#fff" font-size="20" font-weight="700">端到端 RSI 最小示例</text><text x="100" y="563" fill="#a9bbd1" font-size="14">从零复现一次完整的改进回路</text><path d="M462 519h48m-8-6 8 6-8 6" fill="none" stroke="#60758e" stroke-width="2"/><rect x="510" y="444" width="858" height="150" rx="18" fill="#1d263b" stroke="#b48bf4" stroke-width="2"/><rect x="540" y="466" width="122" height="27" rx="13" fill="#443365"/><text x="555" y="485" fill="#ddc6ff" font-size="13" font-weight="700">规划探索方向</text><text x="540" y="530" fill="#fff" font-size="22" font-weight="700">EBC 企业业务能力系统 / MOM 制造运营管理系统</text><text x="540" y="563" fill="#c6b6df" font-size="15">基于 DSH 创造模式，结合低代码平台元数据驱动架构进行重构实现</text><rect x="72" y="631" width="1296" height="74" rx="16" fill="#111c2c" stroke="#30445d"/><text x="100" y="664" fill="#dce6f1" font-size="15" font-weight="700">路线图说明</text><text x="100" y="688" fill="#9fb0c4" font-size="14">表达方向，不承诺日期；阶段与状态以各项目仓库 README 和后续实践为准。EBC / MOM 当前为规划探索方向。</text></g></svg>